services:
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./deploy/local/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [agent, gateway]
  agent:
    build: .
    environment:
      INFERENCE_MODE: ${INFERENCE_MODE:-mock}
      AGENT_API_KEY: ${AGENT_API_KEY:-local-development-only}
      INFERENCE_BASE_URL: http://nginx:8081
      SIE_BASE_URL: ${SIE_BASE_URL:-}
      SIE_MODEL: ${SIE_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      SIE_API_KEY: ${SIE_API_KEY:-}
    volumes: ["repositories:/data"]
  gateway:
    build: .
    command: [uvicorn, "repo_agent.gateway:app", --host, 0.0.0.0, --port, "8080"]
    environment:
      RAY_BASE_URL: ${RAY_BASE_URL:-http://host.docker.internal:8000}
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: ["./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./deploy/local/grafana:/etc/grafana/provisioning:ro
      - ./deploy/local/dashboard.json:/var/lib/grafana/dashboards/agent.json:ro
volumes:
  repositories:
