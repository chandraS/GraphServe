[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "repo-understanding-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "prometheus-client>=0.21,<1", "graphifyy>=0.1", "transformers>=4.45,<5", "jinja2>=3.1,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
repo_agent = ["index.html"]
