apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-agent-dashboard
  namespace: repo-agent
  labels:
    grafana_dashboard: "1"
data:
  repo-agent.json: |-
    {
      "title": "Repository agent and serving",
      "uid": "repo-agent",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "graphserve",
        "ray",
        "vllm"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Agent request rate by operation/status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (operation, status) (rate(agent_requests_total[5m]))",
              "refId": "A",
              "legendFormat": "{{operation}} \u00b7 {{status}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Question latency",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(agent_request_seconds_bucket[5m])))",
              "refId": "A",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(agent_request_seconds_bucket[5m])))",
              "refId": "B",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 3,
          "title": "Gateway request rate by status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
