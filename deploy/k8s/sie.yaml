apiVersion: apps/v1
kind: Deployment
metadata:
  name: sie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sie
  template:
    metadata:
      labels:
        app: sie
    spec:
      nodeSelector:
        graphserve.io/role: control
      automountServiceAccountToken: false
      containers:
        - name: sie
          image: ghcr.io/superlinked/sie-server:latest-cpu-default
          imagePullPolicy: Always
          env:
            - name: SIE_TELEMETRY_DISABLED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: cache
              mountPath: /app/.cache/huggingface
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: sie-cache
---
apiVersion: v1
kind: Service
metadata:
  name: sie
spec:
  selector:
    app: sie
  ports:
    - name: http
      port: 8080
      targetPort: http
