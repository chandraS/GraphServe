apiVersion: v1
kind: PersistentVolume
metadata:
  name: graphserve-repositories
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/graphserve-data/repositories
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repositories
  namespace: repo-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: graphserve-repositories
---
