apiVersion: ray.io/v1
kind: RayService
metadata:
  name: repo-llm
spec:
  serveConfigV2: |
    applications:
    - name: qwen
      route_prefix: /
      import_path: ray.serve.llm:build_openai_app
      args:
        llm_configs:
        - model_loading_config:
            model_id: qwen-coder
            model_source: Qwen/Qwen2.5-Coder-7B-Instruct
          engine_kwargs:
            dtype: bfloat16
            tensor_parallel_size: 1
            max_model_len: 8192
            gpu_memory_utilization: 0.42
            max_num_seqs: 2
            enable_prefix_caching: false
            enforce_eager: true
          placement_group_config:
            bundles:
            - CPU: 2
              GPU: 0.5
            strategy: PACK
          deployment_config:
            num_replicas: 2
            max_ongoing_requests: 2
  rayClusterConfig:
    rayVersion: 2.52.0
    enableInTreeAutoscaling: false
    headGroupSpec:
      rayStartParams:
        dashboard-host: 0.0.0.0
        num-cpus: '0'
        num-gpus: '0'
        metrics-export-port: '8080'
      template:
        metadata:
          labels:
            component: ray
        spec:
          containers:
          - name: ray-head
            image: rayproject/ray-llm:2.52.0-py311-cu128
            ports:
            - name: metrics
              containerPort: 8080
            - name: gcs
              containerPort: 6379
            - name: dashboard
              containerPort: 8265
            - name: client
              containerPort: 10001
            - name: serve
              containerPort: 8000
            resources:
              requests:
                cpu: '2'
                memory: 4Gi
              limits:
                cpu: '2'
                memory: 4Gi
          automountServiceAccountToken: false
    workerGroupSpecs:
    - groupName: gpu
      replicas: 1
      minReplicas: 1
      maxReplicas: 1
      rayStartParams:
        num-cpus: '12'
        num-gpus: '1'
        metrics-export-port: '8080'
      template:
        metadata:
          labels:
            component: ray
        spec:
          containers:
          - name: ray-worker
            image: rayproject/ray-llm:2.52.0-py311-cu128
            ports:
            - name: metrics
              containerPort: 8080
            resources:
              requests:
                cpu: '8'
                memory: 48Gi
                nvidia.com/gpu: '1'
              limits:
                cpu: '16'
                memory: 64Gi
                nvidia.com/gpu: '1'
            volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /home/ray/.cache/huggingface
          automountServiceAccountToken: false
          volumes:
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 8Gi
          - name: hf-cache
            persistentVolumeClaim:
              claimName: hf-cache
